<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemU Agent Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        memu: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-memu-500 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-memu-500/20">
                M
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-900 leading-tight">MemU Agent</h1>
                <p class="text-xs text-slate-500 font-medium">Always-on Memory • <span class="text-green-500">● Online</span></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="clearChat()" class="p-2 text-slate-400 hover:text-red-500 transition-colors rounded-full hover:bg-slate-100" title="チャットをクリア">
                <i class="fas fa-trash-alt"></i>
            </button>
            <a href="https://github.com/kinuman/memu-hackason2026" target="_blank" class="p-2 text-slate-400 hover:text-slate-700 transition-colors rounded-full hover:bg-slate-100">
                <i class="fab fa-github text-lg"></i>
            </a>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth bg-slate-50">
        
        <!-- Welcome Message -->
        <div class="flex justify-start">
            <div class="flex gap-3 max-w-[85%] md:max-w-[70%]">
                <div class="w-8 h-8 rounded-full bg-memu-100 flex items-center justify-center flex-shrink-0 mt-1">
                    <i class="fas fa-robot text-memu-600 text-sm"></i>
                </div>
                <div class="space-y-1">
                    <div class="bg-white border border-slate-100 p-4 rounded-2xl rounded-tl-none shadow-sm text-sm md:text-base leading-relaxed text-slate-700">
                        こんにちは！MemU エージェントです。<br>
                        あなたのことを記憶しながら、会話をサポートします。何でも話しかけてください。
                    </div>
                    <span class="text-[10px] text-slate-400 pl-1">Just now</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t border-slate-200 p-4 md:p-6 z-10">
        <div class="max-w-4xl mx-auto relative">
            <form id="chat-form" onsubmit="sendMessage(event)" class="relative flex items-end gap-2 bg-slate-100 p-2 rounded-3xl border border-transparent focus-within:border-memu-500 focus-within:bg-white focus-within:ring-4 focus-within:ring-memu-500/10 transition-all duration-300">
                <textarea 
                    id="user-input" 
                    rows="1"
                    placeholder="メッセージを入力..." 
                    class="w-full bg-transparent border-none focus:ring-0 text-slate-700 placeholder-slate-400 resize-none py-3 px-4 max-h-32 min-h-[44px]"
                    oninput="autoResize(this)"
                    onkeydown="handleEnter(event)"
                ></textarea>
                <button 
                    type="submit" 
                    id="send-btn"
                    class="p-3 bg-memu-600 hover:bg-memu-500 text-white rounded-full shadow-lg shadow-memu-500/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform active:scale-95 flex-shrink-0 mb-[2px] mr-[2px]"
                >
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
            <p class="text-center text-[10px] text-slate-400 mt-2">
                Powered by Google Gemini & MemU • Hackathon 2026
            </p>
        </div>
    </footer>

    <script>
        const userId = "user_" + Math.random().toString(36).substr(2, 9);
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(e);
            }
        }

        function appendMessage(role, text) {
            const isUser = role === 'user';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const html = `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in-up">
                    <div class="flex gap-3 max-w-[85%] md:max-w-[70%] ${isUser ? 'flex-row-reverse' : ''}">
                        <div class="w-8 h-8 rounded-full ${isUser ? 'bg-indigo-100' : 'bg-memu-100'} flex items-center justify-center flex-shrink-0 mt-1">
                            <i class="fas ${isUser ? 'fa-user text-indigo-600' : 'fa-robot text-memu-600'} text-sm"></i>
                        </div>
                        <div class="space-y-1 ${isUser ? 'items-end flex flex-col' : ''}">
                            <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-100 text-slate-700'} p-3 md:p-4 rounded-2xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} shadow-sm text-sm md:text-base leading-relaxed whitespace-pre-wrap">${text}</div>
                            <span class="text-[10px] text-slate-400 ${isUser ? 'pr-1' : 'pl-1'}">${time}</span>
                        </div>
                    </div>
                </div>
            `;
            
            const div = document.createElement('div');
            div.innerHTML = html;
            chatContainer.appendChild(div.firstElementChild);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendTyping() {
            const html = `
                <div id="typing-indicator" class="flex justify-start animate-pulse">
                    <div class="flex gap-3 max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-memu-100 flex items-center justify-center flex-shrink-0 mt-1">
                            <i class="fas fa-robot text-memu-600 text-sm"></i>
                        </div>
                        <div class="bg-white border border-slate-100 p-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-1 h-[46px]">
                            <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = html;
            chatContainer.appendChild(div.firstElementChild);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // UI Update
            userInput.value = '';
            userInput.style.height = 'auto';
            appendMessage('user', text);
            appendTyping();
            sendBtn.disabled = true;

            try {
                // API Call
                // Use relative path for production, absolute for local dev if on different port (handled by CORS)
                // But since we serve static from same origin in production, relative /chat is best.
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        message: text
                    })
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                removeTyping();
                appendMessage('assistant', data.reply);

            } catch (error) {
                console.error('Error:', error);
                removeTyping();
                appendMessage('assistant', '申し訳ありません。エラーが発生しました。もう一度お試しください。');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
        
        function clearChat() {
            if(confirm('チャット履歴をクリアしますか？')) {
                chatContainer.innerHTML = '';
            }
        }
    </script>
</body>
</html>
